name: Update Age

on:
  schedule:
    - cron: '0 0 17 6 *'
  workflow_dispatch: 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script
        run: python .github/workflows/age.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update age in README"
          file_pattern: README.md
